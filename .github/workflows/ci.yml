name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  actionlint:
    name: Validate action metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color
