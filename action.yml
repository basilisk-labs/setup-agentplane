name: setup-agentplane
description: Install the AgentPlane CLI in GitHub Actions.
inputs:
  version:
    description: AgentPlane version to install. Use a plain semver value such as 0.6.27.
    required: false
    default: "0.6.27"
  verify:
    description: Run an agentplane --version smoke check after installation.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install AgentPlane
      shell: bash
      run: |
        set -euo pipefail
        version="${inputs.version}"
        version="${version#v}"
        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$tmp_dir"' EXIT INT TERM
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          macOS-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.27/agentplane-bun-v0.6.27-darwin-arm64.tar.gz"
            asset_sha256="ad6fc19f7c8045c551f927d7e92a6081387b702e2e0b47ca39f3fc141e3c75c9"
            ;;
          macOS-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.27/agentplane-bun-v0.6.27-darwin-x64.tar.gz"
            asset_sha256="78c37b536a8ff9ebbb8575213bb4ad3591d3af91239fdc702159ccd865beb23e"
            ;;
          Linux-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.27/agentplane-bun-v0.6.27-linux-arm64.tar.gz"
            asset_sha256="89df9f43e43b652ebf19b7ac9da37534e49082a9ef1b15a28c1f7b4ed0283d84"
            ;;
          Linux-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.27/agentplane-bun-v0.6.27-linux-x64.tar.gz"
            asset_sha256="7c69eba7fb1a6dbcf8ced25c84cc27e2085e8d02b6e723eb110e4c0777899a7f"
            ;;
          Windows-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.27/agentplane-bun-v0.6.27-win32-x64.zip"
            asset_sha256="f807a8a8e3aa7a97f42740ca9ea8e9db999e7d0dd6c84223d87aef0088cb7d4a"
            ;;
          *)
            echo "Unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2
            exit 2
            ;;
        esac
        archive="${tmp_dir}/${asset_url##*/}"
        install_dir="${tmp_dir}/agentplane"
        mkdir -p "${install_dir}"
        curl -fsSL "${asset_url}" -o "${archive}"
        actual_sha256="$(shasum -a 256 "${archive}" | awk '{print $1}')"
        if [ "${actual_sha256}" != "${asset_sha256}" ]; then
          echo "agentplane archive checksum mismatch" >&2
          exit 2
        fi
        if [[ "${archive}" == *.zip ]]; then
          powershell -NoProfile -Command "Expand-Archive -LiteralPath '${archive}' -DestinationPath '${install_dir}' -Force"
        else
          tar -xzf "${archive}" -C "${install_dir}"
        fi
        echo "${install_dir}/bin" >> "$GITHUB_PATH"
        if [ "${{ inputs.verify }}" = "true" ]; then
          "${install_dir}/bin/agentplane" --version | grep -Fx "${version}"
        fi
