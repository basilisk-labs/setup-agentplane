name: setup-agentplane
description: Install the AgentPlane CLI in GitHub Actions.
inputs:
  version:
    description: AgentPlane version to install. Use a plain semver value such as 0.7.0.
    required: false
    default: "0.7.0"
  verify:
    description: Run an agentplane --version smoke check after installation.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install AgentPlane
      shell: bash
      run: |
        set -euo pipefail
        version="${inputs.version}"
        version="${version#v}"
        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$tmp_dir"' EXIT INT TERM
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          macOS-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.0/agentplane-bun-v0.7.0-darwin-arm64.tar.gz"
            asset_sha256="edd2be9908f50b5e02fad22e81bb4304750303662fb4f91e4b82d4fff7a1a5a2"
            ;;
          macOS-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.0/agentplane-bun-v0.7.0-darwin-x64.tar.gz"
            asset_sha256="74a6752f4940e1235ca8bb9bce058b29a7b3b33c03bd9b9f705a8ad207591419"
            ;;
          Linux-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.0/agentplane-bun-v0.7.0-linux-arm64.tar.gz"
            asset_sha256="303a2e689414e3e12850d2b5c486b45a7777a9e33e8b4f385f2ec96cc73980bf"
            ;;
          Linux-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.0/agentplane-bun-v0.7.0-linux-x64.tar.gz"
            asset_sha256="8e4dfedfc17ecae0f1e9d1f9bb7fe8993d563c6d1582a13846d0e0c930d2b255"
            ;;
          Windows-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.0/agentplane-bun-v0.7.0-win32-x64.zip"
            asset_sha256="61eff1eb80b2e285e2758117871aae121880a9e17c6a5cbf4f43004cf73427e7"
            ;;
          *)
            echo "Unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2
            exit 2
            ;;
        esac
        archive="${tmp_dir}/${asset_url##*/}"
        install_dir="${tmp_dir}/agentplane"
        mkdir -p "${install_dir}"
        curl -fsSL "${asset_url}" -o "${archive}"
        actual_sha256="$(shasum -a 256 "${archive}" | awk '{print $1}')"
        if [ "${actual_sha256}" != "${asset_sha256}" ]; then
          echo "agentplane archive checksum mismatch" >&2
          exit 2
        fi
        if [[ "${archive}" == *.zip ]]; then
          powershell -NoProfile -Command "Expand-Archive -LiteralPath '${archive}' -DestinationPath '${install_dir}' -Force"
        else
          tar -xzf "${archive}" -C "${install_dir}"
        fi
        echo "${install_dir}/bin" >> "$GITHUB_PATH"
        if [ "${{ inputs.verify }}" = "true" ]; then
          "${install_dir}/bin/agentplane" --version | grep -Fx "${version}"
        fi
