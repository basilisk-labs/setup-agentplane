name: setup-agentplane
description: Install the AgentPlane CLI in GitHub Actions.
inputs:
  version:
    description: AgentPlane version to install. Use a plain semver value such as 0.7.4.
    required: false
    default: "0.7.4"
  verify:
    description: Run an agentplane --version smoke check after installation.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install AgentPlane
      shell: bash
      run: |
        set -euo pipefail
        version="${inputs.version}"
        version="${version#v}"
        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$tmp_dir"' EXIT INT TERM
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          macOS-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.4/agentplane-bun-v0.7.4-darwin-arm64.tar.gz"
            asset_sha256="6cdce15fa32ad9f0186a3198752a4fc9f496fa811a6d16d31f688f819cce6648"
            ;;
          macOS-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.4/agentplane-bun-v0.7.4-darwin-x64.tar.gz"
            asset_sha256="92cda82ee167f3529469da47d91ee361a917204c0739722f5840f6a20903ba3a"
            ;;
          Linux-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.4/agentplane-bun-v0.7.4-linux-arm64.tar.gz"
            asset_sha256="0323e0625ef51d62e41b7159bc4a20f808ab95f72685f4a1d76adeda1f2825e7"
            ;;
          Linux-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.4/agentplane-bun-v0.7.4-linux-x64.tar.gz"
            asset_sha256="5ff4e4a315a3661e8f1c7607996d7fec24438b8ce0609a5c67613e517f74be5e"
            ;;
          Windows-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.4/agentplane-bun-v0.7.4-win32-x64.zip"
            asset_sha256="5be2c48a05b9af5238a96faaf59192ba84df8aa3933d2249248b32697fcd1e31"
            ;;
          *)
            echo "Unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2
            exit 2
            ;;
        esac
        archive="${tmp_dir}/${asset_url##*/}"
        install_dir="${tmp_dir}/agentplane"
        mkdir -p "${install_dir}"
        curl -fsSL "${asset_url}" -o "${archive}"
        actual_sha256="$(shasum -a 256 "${archive}" | awk '{print $1}')"
        if [ "${actual_sha256}" != "${asset_sha256}" ]; then
          echo "agentplane archive checksum mismatch" >&2
          exit 2
        fi
        if [[ "${archive}" == *.zip ]]; then
          powershell -NoProfile -Command "Expand-Archive -LiteralPath '${archive}' -DestinationPath '${install_dir}' -Force"
        else
          tar -xzf "${archive}" -C "${install_dir}"
        fi
        echo "${install_dir}/bin" >> "$GITHUB_PATH"
        if [ "${{ inputs.verify }}" = "true" ]; then
          "${install_dir}/bin/agentplane" --version | grep -Fx "${version}"
        fi
