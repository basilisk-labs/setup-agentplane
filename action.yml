name: setup-agentplane
description: Install the AgentPlane CLI in GitHub Actions.
inputs:
  version:
    description: AgentPlane version to install. Use a plain semver value such as 0.7.9.
    required: false
    default: "0.7.9"
  verify:
    description: Run an agentplane --version smoke check after installation.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install AgentPlane
      shell: bash
      env:
        AGENTPLANE_VERSION: ${{ inputs.version }}
        AGENTPLANE_VERIFY: ${{ inputs.verify }}
      run: |
        set -euo pipefail
        version="${AGENTPLANE_VERSION#v}"
        if [ "${version}" != "0.7.9" ]; then
          echo "This action installs 0.7.9; use the matching action tag for another version." >&2
          exit 2
        fi
        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$tmp_dir"' EXIT INT TERM
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          macOS-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.9/agentplane-bun-v0.7.9-darwin-arm64.tar.gz"
            asset_sha256="2a03395b789ad9c9ab7fc8ad2ee49b004c4fefd617a8238748ca3b5fb8eb00b5"
            ;;
          macOS-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.9/agentplane-bun-v0.7.9-darwin-x64.tar.gz"
            asset_sha256="6b66e58318aa01885ba94b2a3e6c76342206020247c3348f44da78f354a86960"
            ;;
          Linux-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.9/agentplane-bun-v0.7.9-linux-arm64.tar.gz"
            asset_sha256="e57444b9f1b3f7b42ae0b4a244a2f4c52c25d43f59541ae6cb1bab1a98f3dc79"
            ;;
          Linux-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.9/agentplane-bun-v0.7.9-linux-x64.tar.gz"
            asset_sha256="c1ef085853552ccd8fdc9230a5f8b6bc23d4dda7402c085d9e661c836336d539"
            ;;
          Windows-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.9/agentplane-bun-v0.7.9-win32-x64.zip"
            asset_sha256="a533104228fc50c819ec05a17876c6b96de7d3f5b912cd767a0a977050521029"
            ;;
          *)
            echo "Unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2
            exit 2
            ;;
        esac
        archive="${tmp_dir}/${asset_url##*/}"
        curl -fsSL "${asset_url}" -o "${archive}"
        actual_sha256="$(shasum -a 256 "${archive}" | awk '{print $1}')"
        if [ "${actual_sha256}" != "${asset_sha256}" ]; then
          echo "agentplane archive checksum mismatch" >&2
          exit 2
        fi
        install_dir="$(mktemp -d "${RUNNER_TEMP:?}/agentplane.XXXXXX")"
        if [[ "${archive}" == *.zip ]]; then
          powershell -NoProfile -Command "Expand-Archive -LiteralPath '${archive}' -DestinationPath '${install_dir}' -Force"
        else
          tar -xzf "${archive}" -C "${install_dir}"
        fi
        if [ "${AGENTPLANE_VERIFY}" = "true" ]; then
          "${install_dir}/bin/agentplane" --version | grep -Fx "${version}"
        fi
        echo "${install_dir}/bin" >> "$GITHUB_PATH"
