name: setup-agentplane
description: Install the AgentPlane CLI in GitHub Actions.
inputs:
  version:
    description: AgentPlane version to install. Use a plain semver value such as 0.7.6.
    required: false
    default: "0.7.6"
  verify:
    description: Run an agentplane --version smoke check after installation.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install AgentPlane
      shell: bash
      run: |
        set -euo pipefail
        version="${inputs.version}"
        version="${version#v}"
        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$tmp_dir"' EXIT INT TERM
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          macOS-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.6/agentplane-bun-v0.7.6-darwin-arm64.tar.gz"
            asset_sha256="d556f9bf33ca19cca9553547a16b07fe8445756809d5b408c9a3ef3ce2eff7db"
            ;;
          macOS-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.6/agentplane-bun-v0.7.6-darwin-x64.tar.gz"
            asset_sha256="6e1db1a6a76d0dd6b575c3c52c97e66f64f9a124e26d783282078de9de0d6f31"
            ;;
          Linux-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.6/agentplane-bun-v0.7.6-linux-arm64.tar.gz"
            asset_sha256="c76c19eb12b1f053c197a8f0ec2e7e11c8d9b4913287957c73ec1977402c3903"
            ;;
          Linux-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.6/agentplane-bun-v0.7.6-linux-x64.tar.gz"
            asset_sha256="c4b709e83ee6036630f78009003d0574c4c58e70a51cdfc88769c3f20c8c7f61"
            ;;
          Windows-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.6/agentplane-bun-v0.7.6-win32-x64.zip"
            asset_sha256="510f08f78dc69738f6a88646a983efcd34b24855ef157b221011458f194425c7"
            ;;
          *)
            echo "Unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2
            exit 2
            ;;
        esac
        archive="${tmp_dir}/${asset_url##*/}"
        install_dir="${tmp_dir}/agentplane"
        mkdir -p "${install_dir}"
        curl -fsSL "${asset_url}" -o "${archive}"
        actual_sha256="$(shasum -a 256 "${archive}" | awk '{print $1}')"
        if [ "${actual_sha256}" != "${asset_sha256}" ]; then
          echo "agentplane archive checksum mismatch" >&2
          exit 2
        fi
        if [[ "${archive}" == *.zip ]]; then
          powershell -NoProfile -Command "Expand-Archive -LiteralPath '${archive}' -DestinationPath '${install_dir}' -Force"
        else
          tar -xzf "${archive}" -C "${install_dir}"
        fi
        echo "${install_dir}/bin" >> "$GITHUB_PATH"
        if [ "${{ inputs.verify }}" = "true" ]; then
          "${install_dir}/bin/agentplane" --version | grep -Fx "${version}"
        fi
