name: setup-agentplane
description: Install the AgentPlane CLI in GitHub Actions.
inputs:
  version:
    description: AgentPlane version to install. Use a plain semver value such as 0.7.2.
    required: false
    default: "0.7.2"
  verify:
    description: Run an agentplane --version smoke check after installation.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install AgentPlane
      shell: bash
      run: |
        set -euo pipefail
        version="${inputs.version}"
        version="${version#v}"
        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$tmp_dir"' EXIT INT TERM
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          macOS-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.2/agentplane-bun-v0.7.2-darwin-arm64.tar.gz"
            asset_sha256="5af8da14c35c2698d06eb0d7150f4af6edb93c5f2d2a455271e68c0949589544"
            ;;
          macOS-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.2/agentplane-bun-v0.7.2-darwin-x64.tar.gz"
            asset_sha256="d002f31631e24e2836f3c549e5ecdcab3dc75e3eaf81645b4a386174006ff821"
            ;;
          Linux-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.2/agentplane-bun-v0.7.2-linux-arm64.tar.gz"
            asset_sha256="07b8b68cbac633ad14416f9d4e61db71ff2a94a07350904edfc37cf17ddf61ff"
            ;;
          Linux-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.2/agentplane-bun-v0.7.2-linux-x64.tar.gz"
            asset_sha256="81a4bec528d01684a95a4cf3b3490a5b42b3e897711cd956a439ad810bc112d3"
            ;;
          Windows-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.2/agentplane-bun-v0.7.2-win32-x64.zip"
            asset_sha256="6dce4d1c5d8705dfc3f7d36b6cb77b0e6b1bbf17a21c52c5c2d356bf3e734a53"
            ;;
          *)
            echo "Unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2
            exit 2
            ;;
        esac
        archive="${tmp_dir}/${asset_url##*/}"
        install_dir="${tmp_dir}/agentplane"
        mkdir -p "${install_dir}"
        curl -fsSL "${asset_url}" -o "${archive}"
        actual_sha256="$(shasum -a 256 "${archive}" | awk '{print $1}')"
        if [ "${actual_sha256}" != "${asset_sha256}" ]; then
          echo "agentplane archive checksum mismatch" >&2
          exit 2
        fi
        if [[ "${archive}" == *.zip ]]; then
          powershell -NoProfile -Command "Expand-Archive -LiteralPath '${archive}' -DestinationPath '${install_dir}' -Force"
        else
          tar -xzf "${archive}" -C "${install_dir}"
        fi
        echo "${install_dir}/bin" >> "$GITHUB_PATH"
        if [ "${{ inputs.verify }}" = "true" ]; then
          "${install_dir}/bin/agentplane" --version | grep -Fx "${version}"
        fi
