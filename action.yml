name: setup-agentplane
description: Install the AgentPlane CLI in GitHub Actions.
inputs:
  version:
    description: AgentPlane version to install. Use a plain semver value such as 0.6.28.
    required: false
    default: "0.6.28"
  verify:
    description: Run an agentplane --version smoke check after installation.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install AgentPlane
      shell: bash
      run: |
        set -euo pipefail
        version="${inputs.version}"
        version="${version#v}"
        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$tmp_dir"' EXIT INT TERM
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          macOS-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.28/agentplane-bun-v0.6.28-darwin-arm64.tar.gz"
            asset_sha256="fe508639bbc4cc00978798854c237f78e2bcc06f558baf06ef44cc473dbf28d5"
            ;;
          macOS-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.28/agentplane-bun-v0.6.28-darwin-x64.tar.gz"
            asset_sha256="cc67764948fc22e9c8dbfd26663e8db52c96667f84b6b3f8afebcb2703b666d5"
            ;;
          Linux-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.28/agentplane-bun-v0.6.28-linux-arm64.tar.gz"
            asset_sha256="4f7f99da930b9a81ba319d5ba41048349cb22ce3ab43b857dd5ed252b95b853f"
            ;;
          Linux-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.28/agentplane-bun-v0.6.28-linux-x64.tar.gz"
            asset_sha256="ae8e764e3782ddf4af1eb964dcb62206baac81427a3a1f20a4c30d71a7f54be2"
            ;;
          Windows-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.28/agentplane-bun-v0.6.28-win32-x64.zip"
            asset_sha256="910b1397f9409968a499d7cf3583917e43007fc33f181c2a347b0be8877c70b3"
            ;;
          *)
            echo "Unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2
            exit 2
            ;;
        esac
        archive="${tmp_dir}/${asset_url##*/}"
        install_dir="${tmp_dir}/agentplane"
        mkdir -p "${install_dir}"
        curl -fsSL "${asset_url}" -o "${archive}"
        actual_sha256="$(shasum -a 256 "${archive}" | awk '{print $1}')"
        if [ "${actual_sha256}" != "${asset_sha256}" ]; then
          echo "agentplane archive checksum mismatch" >&2
          exit 2
        fi
        if [[ "${archive}" == *.zip ]]; then
          powershell -NoProfile -Command "Expand-Archive -LiteralPath '${archive}' -DestinationPath '${install_dir}' -Force"
        else
          tar -xzf "${archive}" -C "${install_dir}"
        fi
        echo "${install_dir}/bin" >> "$GITHUB_PATH"
        if [ "${{ inputs.verify }}" = "true" ]; then
          "${install_dir}/bin/agentplane" --version | grep -Fx "${version}"
        fi
