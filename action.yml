name: setup-agentplane
description: Install the AgentPlane CLI in GitHub Actions.
inputs:
  version:
    description: AgentPlane version to install. Use a plain semver value such as 0.6.30.
    required: false
    default: "0.6.30"
  verify:
    description: Run an agentplane --version smoke check after installation.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install AgentPlane
      shell: bash
      run: |
        set -euo pipefail
        version="${inputs.version}"
        version="${version#v}"
        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$tmp_dir"' EXIT INT TERM
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          macOS-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.30/agentplane-bun-v0.6.30-darwin-arm64.tar.gz"
            asset_sha256="ebea0ae2a5b72c6e471ba6e2024390d556e825fcdfac812c62879b03b1c59dae"
            ;;
          macOS-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.30/agentplane-bun-v0.6.30-darwin-x64.tar.gz"
            asset_sha256="d48407cbcae5f20ef3b7974e35f64263d7d8d270b51b7ec5540ec485a562828e"
            ;;
          Linux-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.30/agentplane-bun-v0.6.30-linux-arm64.tar.gz"
            asset_sha256="69e61deff64e616cc44ba19179075c9780985dc1dd94e8fae0d74066fb60326c"
            ;;
          Linux-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.30/agentplane-bun-v0.6.30-linux-x64.tar.gz"
            asset_sha256="00524a7832cea1042b4d9cdf39fa4412b690ca1ca2078ccd52e5e1d39d25ef7d"
            ;;
          Windows-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.30/agentplane-bun-v0.6.30-win32-x64.zip"
            asset_sha256="8666d23ea0bd8e10d8e4b8abada64709298972f4e1d3df75c1ee35567ec16879"
            ;;
          *)
            echo "Unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2
            exit 2
            ;;
        esac
        archive="${tmp_dir}/${asset_url##*/}"
        install_dir="${tmp_dir}/agentplane"
        mkdir -p "${install_dir}"
        curl -fsSL "${asset_url}" -o "${archive}"
        actual_sha256="$(shasum -a 256 "${archive}" | awk '{print $1}')"
        if [ "${actual_sha256}" != "${asset_sha256}" ]; then
          echo "agentplane archive checksum mismatch" >&2
          exit 2
        fi
        if [[ "${archive}" == *.zip ]]; then
          powershell -NoProfile -Command "Expand-Archive -LiteralPath '${archive}' -DestinationPath '${install_dir}' -Force"
        else
          tar -xzf "${archive}" -C "${install_dir}"
        fi
        echo "${install_dir}/bin" >> "$GITHUB_PATH"
        if [ "${{ inputs.verify }}" = "true" ]; then
          "${install_dir}/bin/agentplane" --version | grep -Fx "${version}"
        fi
