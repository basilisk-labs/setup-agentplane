name: setup-agentplane
description: Install the AgentPlane CLI in GitHub Actions.
inputs:
  version:
    description: AgentPlane version to install. Use a plain semver value such as 0.6.9.
    required: false
    default: "0.6.9"
  verify:
    description: Run an agentplane --version smoke check after installation.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install AgentPlane
      shell: bash
      run: |
        set -euo pipefail
        version="${inputs.version}"
        version="${version#v}"
        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$tmp_dir"' EXIT INT TERM
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          macOS-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.9/agentplane-bun-v0.6.9-darwin-arm64.tar.gz"
            asset_sha256="daacaf9528b9348a40de210e17a0e7856c9597c0f053b6eab9c66b6df253aab5"
            ;;
          macOS-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.9/agentplane-bun-v0.6.9-darwin-x64.tar.gz"
            asset_sha256="a5780355fc6539b48e5c0e442194a25147c3a3853ab3408583ba86581480e238"
            ;;
          Linux-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.9/agentplane-bun-v0.6.9-linux-arm64.tar.gz"
            asset_sha256="459e37d24eec607e05cbab010b0bc5a51097b10c824c15a76cf0f3de132c1edc"
            ;;
          Linux-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.9/agentplane-bun-v0.6.9-linux-x64.tar.gz"
            asset_sha256="3a4cee5b32bbd73db366fcbe8cdcf1677869be7362b8386218153380bb72e064"
            ;;
          Windows-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.9/agentplane-bun-v0.6.9-win32-x64.zip"
            asset_sha256="bc71e683d985d00adca3a8cb97317eb1454337c84f958be0f5a947ca7bb9ca1a"
            ;;
          *)
            echo "Unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2
            exit 2
            ;;
        esac
        archive="${tmp_dir}/${asset_url##*/}"
        install_dir="${tmp_dir}/agentplane"
        mkdir -p "${install_dir}"
        curl -fsSL "${asset_url}" -o "${archive}"
        actual_sha256="$(shasum -a 256 "${archive}" | awk '{print $1}')"
        if [ "${actual_sha256}" != "${asset_sha256}" ]; then
          echo "agentplane archive checksum mismatch" >&2
          exit 2
        fi
        if [[ "${archive}" == *.zip ]]; then
          powershell -NoProfile -Command "Expand-Archive -LiteralPath '${archive}' -DestinationPath '${install_dir}' -Force"
        else
          tar -xzf "${archive}" -C "${install_dir}"
        fi
        echo "${install_dir}/bin" >> "$GITHUB_PATH"
        if [ "${{ inputs.verify }}" = "true" ]; then
          "${install_dir}/bin/agentplane" --version | grep -Fx "${version}"
        fi
