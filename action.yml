name: setup-agentplane
description: Install the AgentPlane CLI in GitHub Actions.
inputs:
  version:
    description: AgentPlane version to install. Use a plain semver value such as 0.6.13.
    required: false
    default: "0.6.13"
  verify:
    description: Run an agentplane --version smoke check after installation.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install AgentPlane
      shell: bash
      run: |
        set -euo pipefail
        version="${inputs.version}"
        version="${version#v}"
        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$tmp_dir"' EXIT INT TERM
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          macOS-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.13/agentplane-bun-v0.6.13-darwin-arm64.tar.gz"
            asset_sha256="06b39cf8f8cf23d6a8e544560d5254083cdaca1b07a34abf02a69558cf3f92df"
            ;;
          macOS-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.13/agentplane-bun-v0.6.13-darwin-x64.tar.gz"
            asset_sha256="bfd70dca8b3f795eaceb3a5fb7c307668344baf492cb40fca9fb247c736bcfb3"
            ;;
          Linux-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.13/agentplane-bun-v0.6.13-linux-arm64.tar.gz"
            asset_sha256="a41d79da77bc59489f79db1e2eb3649c6e05badbc3dc373c57bfaa2005ca4fc5"
            ;;
          Linux-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.13/agentplane-bun-v0.6.13-linux-x64.tar.gz"
            asset_sha256="961402d6cc7571380462b264fda022ef61a587aa71b711f4e238b0b3369e92bc"
            ;;
          Windows-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.13/agentplane-bun-v0.6.13-win32-x64.zip"
            asset_sha256="96e7fb45c470960627d6f479d19cd3073b1c9de33046e97470832da24d217dfe"
            ;;
          *)
            echo "Unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2
            exit 2
            ;;
        esac
        archive="${tmp_dir}/${asset_url##*/}"
        install_dir="${tmp_dir}/agentplane"
        mkdir -p "${install_dir}"
        curl -fsSL "${asset_url}" -o "${archive}"
        actual_sha256="$(shasum -a 256 "${archive}" | awk '{print $1}')"
        if [ "${actual_sha256}" != "${asset_sha256}" ]; then
          echo "agentplane archive checksum mismatch" >&2
          exit 2
        fi
        if [[ "${archive}" == *.zip ]]; then
          powershell -NoProfile -Command "Expand-Archive -LiteralPath '${archive}' -DestinationPath '${install_dir}' -Force"
        else
          tar -xzf "${archive}" -C "${install_dir}"
        fi
        echo "${install_dir}/bin" >> "$GITHUB_PATH"
        if [ "${{ inputs.verify }}" = "true" ]; then
          "${install_dir}/bin/agentplane" --version | grep -Fx "${version}"
        fi
