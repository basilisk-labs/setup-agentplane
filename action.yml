name: setup-agentplane
description: Install the AgentPlane CLI in GitHub Actions.
inputs:
  version:
    description: AgentPlane version to install. Use a plain semver value such as 0.7.3.
    required: false
    default: "0.7.3"
  verify:
    description: Run an agentplane --version smoke check after installation.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install AgentPlane
      shell: bash
      run: |
        set -euo pipefail
        version="${inputs.version}"
        version="${version#v}"
        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$tmp_dir"' EXIT INT TERM
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          macOS-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.3/agentplane-bun-v0.7.3-darwin-arm64.tar.gz"
            asset_sha256="75ae8980136b33fa917425351bac18d89d45dafd54df0b7d5ab6d2697b98a1f2"
            ;;
          macOS-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.3/agentplane-bun-v0.7.3-darwin-x64.tar.gz"
            asset_sha256="e10b5f7eafe95e2613ca57e29520d57474d01e36c2fe5d7e823ffa44889c5687"
            ;;
          Linux-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.3/agentplane-bun-v0.7.3-linux-arm64.tar.gz"
            asset_sha256="e3f4157efef775ff123d3550ad2f24cc590ec8fa3bce48baa465b86dd9331c63"
            ;;
          Linux-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.3/agentplane-bun-v0.7.3-linux-x64.tar.gz"
            asset_sha256="09f03c29c0855f88fb4195c67e2ecc43dde8b88fbfec379bb1a1cd647decd646"
            ;;
          Windows-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.3/agentplane-bun-v0.7.3-win32-x64.zip"
            asset_sha256="f24199820f8d0a30f5bf4c8c41cab594815e011e48244bf8d2a5e5d08f2363bd"
            ;;
          *)
            echo "Unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2
            exit 2
            ;;
        esac
        archive="${tmp_dir}/${asset_url##*/}"
        install_dir="${tmp_dir}/agentplane"
        mkdir -p "${install_dir}"
        curl -fsSL "${asset_url}" -o "${archive}"
        actual_sha256="$(shasum -a 256 "${archive}" | awk '{print $1}')"
        if [ "${actual_sha256}" != "${asset_sha256}" ]; then
          echo "agentplane archive checksum mismatch" >&2
          exit 2
        fi
        if [[ "${archive}" == *.zip ]]; then
          powershell -NoProfile -Command "Expand-Archive -LiteralPath '${archive}' -DestinationPath '${install_dir}' -Force"
        else
          tar -xzf "${archive}" -C "${install_dir}"
        fi
        echo "${install_dir}/bin" >> "$GITHUB_PATH"
        if [ "${{ inputs.verify }}" = "true" ]; then
          "${install_dir}/bin/agentplane" --version | grep -Fx "${version}"
        fi
