name: setup-agentplane
description: Install the AgentPlane CLI in GitHub Actions.
inputs:
  version:
    description: AgentPlane version to install. Use a plain semver value such as 0.6.15.
    required: false
    default: "0.6.15"
  verify:
    description: Run an agentplane --version smoke check after installation.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install AgentPlane
      shell: bash
      run: |
        set -euo pipefail
        version="${inputs.version}"
        version="${version#v}"
        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$tmp_dir"' EXIT INT TERM
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          macOS-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.15/agentplane-bun-v0.6.15-darwin-arm64.tar.gz"
            asset_sha256="f744a992d549bfb763dfbe5abd618593f962a47fb21e5f51a1083db474fa48d3"
            ;;
          macOS-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.15/agentplane-bun-v0.6.15-darwin-x64.tar.gz"
            asset_sha256="6fedd8c7456a08072904ab887fa97af59a9be35a27a4f4906e36e623addbc33e"
            ;;
          Linux-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.15/agentplane-bun-v0.6.15-linux-arm64.tar.gz"
            asset_sha256="7bd36cdef955683bf8f9662ee39d796e386cc23a28739c3c07d5c09715fe4782"
            ;;
          Linux-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.15/agentplane-bun-v0.6.15-linux-x64.tar.gz"
            asset_sha256="ccf3c96e412a017b594c41df8261cd23b7a79680d7c4e1bf51e09f6986cf7f97"
            ;;
          Windows-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.15/agentplane-bun-v0.6.15-win32-x64.zip"
            asset_sha256="3cf09b0da51bf9baa99570663490ff315aac43959e0986ec1b27e87dbe02f8c6"
            ;;
          *)
            echo "Unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2
            exit 2
            ;;
        esac
        archive="${tmp_dir}/${asset_url##*/}"
        install_dir="${tmp_dir}/agentplane"
        mkdir -p "${install_dir}"
        curl -fsSL "${asset_url}" -o "${archive}"
        actual_sha256="$(shasum -a 256 "${archive}" | awk '{print $1}')"
        if [ "${actual_sha256}" != "${asset_sha256}" ]; then
          echo "agentplane archive checksum mismatch" >&2
          exit 2
        fi
        if [[ "${archive}" == *.zip ]]; then
          powershell -NoProfile -Command "Expand-Archive -LiteralPath '${archive}' -DestinationPath '${install_dir}' -Force"
        else
          tar -xzf "${archive}" -C "${install_dir}"
        fi
        echo "${install_dir}/bin" >> "$GITHUB_PATH"
        if [ "${{ inputs.verify }}" = "true" ]; then
          "${install_dir}/bin/agentplane" --version | grep -Fx "${version}"
        fi
