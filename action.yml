name: setup-agentplane
description: Install the AgentPlane CLI in GitHub Actions.
inputs:
  version:
    description: AgentPlane version to install. Use a plain semver value such as 0.7.13.
    required: false
    default: "0.7.13"
  verify:
    description: Run an agentplane --version smoke check after installation.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install AgentPlane
      shell: bash
      env:
        AGENTPLANE_VERSION: ${{ inputs.version }}
        AGENTPLANE_VERIFY: ${{ inputs.verify }}
      run: |
        set -euo pipefail
        version="${AGENTPLANE_VERSION#v}"
        if [ "${version}" != "0.7.13" ]; then
          echo "This action installs 0.7.13; use the matching action tag for another version." >&2
          exit 2
        fi
        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$tmp_dir"' EXIT INT TERM
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          macOS-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.13/agentplane-bun-v0.7.13-darwin-arm64.tar.gz"
            asset_sha256="8a95c0c428715323be132b2214d90e295aa655e9a9e8a40ca051bc5c5180ff64"
            ;;
          macOS-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.13/agentplane-bun-v0.7.13-darwin-x64.tar.gz"
            asset_sha256="b1c16dddb2dc500a5e35c94b5b96584c1807e0fbad15e017634ff5a34c02d1e9"
            ;;
          Linux-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.13/agentplane-bun-v0.7.13-linux-arm64.tar.gz"
            asset_sha256="034bfc365f4a07184a6416a8f3d6b485ad6c1990a6f411df5f6aeda81c97aa56"
            ;;
          Linux-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.13/agentplane-bun-v0.7.13-linux-x64.tar.gz"
            asset_sha256="ff8d86041ce7a66af168ddb3fea88a4df8df081a083e455614348081e1530d23"
            ;;
          Windows-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.13/agentplane-bun-v0.7.13-win32-x64.zip"
            asset_sha256="951113ce25168ad40b593c6f24c9ad9a2f9951a794488e790adcbedb24f99dff"
            ;;
          *)
            echo "Unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2
            exit 2
            ;;
        esac
        archive="${tmp_dir}/${asset_url##*/}"
        curl -fsSL "${asset_url}" -o "${archive}"
        actual_sha256="$(shasum -a 256 "${archive}" | awk '{print $1}')"
        if [ "${actual_sha256}" != "${asset_sha256}" ]; then
          echo "agentplane archive checksum mismatch" >&2
          exit 2
        fi
        install_dir="$(mktemp -d "${RUNNER_TEMP:?}/agentplane.XXXXXX")"
        if [[ "${archive}" == *.zip ]]; then
          powershell -NoProfile -Command "Expand-Archive -LiteralPath '${archive}' -DestinationPath '${install_dir}' -Force"
        else
          tar -xzf "${archive}" -C "${install_dir}"
        fi
        if [ "${AGENTPLANE_VERIFY}" = "true" ]; then
          "${install_dir}/bin/agentplane" --version | grep -Fx "${version}"
        fi
        echo "${install_dir}/bin" >> "$GITHUB_PATH"
