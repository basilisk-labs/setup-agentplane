name: setup-agentplane
description: Install the AgentPlane CLI in GitHub Actions.
inputs:
  version:
    description: AgentPlane version to install. Use a plain semver value such as 0.6.20.
    required: false
    default: "0.6.20"
  verify:
    description: Run an agentplane --version smoke check after installation.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install AgentPlane
      shell: bash
      run: |
        set -euo pipefail
        version="${inputs.version}"
        version="${version#v}"
        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$tmp_dir"' EXIT INT TERM
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          macOS-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.20/agentplane-bun-v0.6.20-darwin-arm64.tar.gz"
            asset_sha256="ecc19e717de3be78f22141f1840d9d5ebc68270b74daf5020c662fbf195bf601"
            ;;
          macOS-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.20/agentplane-bun-v0.6.20-darwin-x64.tar.gz"
            asset_sha256="9461b7c890e8d0da67d750685c6538e77d5c0b0fce0ccfcd0935428d3fc53afd"
            ;;
          Linux-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.20/agentplane-bun-v0.6.20-linux-arm64.tar.gz"
            asset_sha256="0db1a4408a34fdfffcb12f687901af9ff251263dc22163ef8d0e29eed93ac929"
            ;;
          Linux-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.20/agentplane-bun-v0.6.20-linux-x64.tar.gz"
            asset_sha256="dd7bce971ee72329ccb424c9c5ccbe26326f512028bd73ed6d10caae7fee34ca"
            ;;
          Windows-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.20/agentplane-bun-v0.6.20-win32-x64.zip"
            asset_sha256="70838e1dfd2113b33ba36f0e2378de407282527e088e6594580435002ad18a06"
            ;;
          *)
            echo "Unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2
            exit 2
            ;;
        esac
        archive="${tmp_dir}/${asset_url##*/}"
        install_dir="${tmp_dir}/agentplane"
        mkdir -p "${install_dir}"
        curl -fsSL "${asset_url}" -o "${archive}"
        actual_sha256="$(shasum -a 256 "${archive}" | awk '{print $1}')"
        if [ "${actual_sha256}" != "${asset_sha256}" ]; then
          echo "agentplane archive checksum mismatch" >&2
          exit 2
        fi
        if [[ "${archive}" == *.zip ]]; then
          powershell -NoProfile -Command "Expand-Archive -LiteralPath '${archive}' -DestinationPath '${install_dir}' -Force"
        else
          tar -xzf "${archive}" -C "${install_dir}"
        fi
        echo "${install_dir}/bin" >> "$GITHUB_PATH"
        if [ "${{ inputs.verify }}" = "true" ]; then
          "${install_dir}/bin/agentplane" --version | grep -Fx "${version}"
        fi
