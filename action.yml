name: setup-agentplane
description: Install the AgentPlane CLI in GitHub Actions.
inputs:
  version:
    description: AgentPlane version to install. Use a plain semver value such as 0.6.2.
    required: false
    default: "0.6.2"
  verify:
    description: Run an agentplane --version smoke check after installation.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install AgentPlane
      shell: bash
      run: |
        set -euo pipefail
        version="${inputs.version}"
        version="${version#v}"
        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$tmp_dir"' EXIT INT TERM
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          macOS-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.2/agentplane-bun-v0.6.2-darwin-arm64.tar.gz"
            asset_sha256="ec91cd481922aa85ea20830325ff38fa0485e53db882a88776c451c701f6877a"
            ;;
          macOS-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.2/agentplane-bun-v0.6.2-darwin-x64.tar.gz"
            asset_sha256="9241097e881ce7b0da43b1f3fbc48beedb3bf1ba25cb3d4eb0b2891a18c650cf"
            ;;
          Linux-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.2/agentplane-bun-v0.6.2-linux-arm64.tar.gz"
            asset_sha256="f335836d3ed85a317fb132fa7e69e10d0feaa269edef678c9982cfdf0f0b7d4d"
            ;;
          Linux-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.2/agentplane-bun-v0.6.2-linux-x64.tar.gz"
            asset_sha256="b7640861ca1e380e63be99e4e6d0e8d5d8ce938bef751b76d8df4066550b78b1"
            ;;
          Windows-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.2/agentplane-bun-v0.6.2-win32-x64.zip"
            asset_sha256="e591a4f94cad3c99aaa41eb7b443df77014d3bb70886440850c19ac3cc99dc1f"
            ;;
          *)
            echo "Unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2
            exit 2
            ;;
        esac
        archive="${tmp_dir}/${asset_url##*/}"
        install_dir="${tmp_dir}/agentplane"
        mkdir -p "${install_dir}"
        curl -fsSL "${asset_url}" -o "${archive}"
        actual_sha256="$(shasum -a 256 "${archive}" | awk '{print $1}')"
        if [ "${actual_sha256}" != "${asset_sha256}" ]; then
          echo "agentplane archive checksum mismatch" >&2
          exit 2
        fi
        if [[ "${archive}" == *.zip ]]; then
          powershell -NoProfile -Command "Expand-Archive -LiteralPath '${archive}' -DestinationPath '${install_dir}' -Force"
        else
          tar -xzf "${archive}" -C "${install_dir}"
        fi
        echo "${install_dir}/bin" >> "$GITHUB_PATH"
        if [ "${{ inputs.verify }}" = "true" ]; then
          "${install_dir}/bin/agentplane" --version | grep -Fx "${version}"
        fi
