name: setup-agentplane
description: Install the AgentPlane CLI in GitHub Actions.
inputs:
  version:
    description: AgentPlane version to install. Use a plain semver value such as 0.7.1.
    required: false
    default: "0.7.1"
  verify:
    description: Run an agentplane --version smoke check after installation.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install AgentPlane
      shell: bash
      run: |
        set -euo pipefail
        version="${inputs.version}"
        version="${version#v}"
        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$tmp_dir"' EXIT INT TERM
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          macOS-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.1/agentplane-bun-v0.7.1-darwin-arm64.tar.gz"
            asset_sha256="09dcb0a1d4c373d6022325182d53b9e5e2cd4eb044f5ac1fd582d60e648d63cc"
            ;;
          macOS-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.1/agentplane-bun-v0.7.1-darwin-x64.tar.gz"
            asset_sha256="c6aaaafa0f0243c9a728033ec31fb10362b9e470b96933adf88d4b6874c4527b"
            ;;
          Linux-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.1/agentplane-bun-v0.7.1-linux-arm64.tar.gz"
            asset_sha256="91573f3395e576942f6b6b23e49a35db1947cddff9719f6da7b124bc381a67b4"
            ;;
          Linux-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.1/agentplane-bun-v0.7.1-linux-x64.tar.gz"
            asset_sha256="80473f557f9355b12d51d0433bc251e3bf6518f73e800e73b89865d86f653d8a"
            ;;
          Windows-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.1/agentplane-bun-v0.7.1-win32-x64.zip"
            asset_sha256="fb89b6ae15b7d9bedbba201597eb1689d55540c9faa059d380b64edabf25e613"
            ;;
          *)
            echo "Unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2
            exit 2
            ;;
        esac
        archive="${tmp_dir}/${asset_url##*/}"
        install_dir="${tmp_dir}/agentplane"
        mkdir -p "${install_dir}"
        curl -fsSL "${asset_url}" -o "${archive}"
        actual_sha256="$(shasum -a 256 "${archive}" | awk '{print $1}')"
        if [ "${actual_sha256}" != "${asset_sha256}" ]; then
          echo "agentplane archive checksum mismatch" >&2
          exit 2
        fi
        if [[ "${archive}" == *.zip ]]; then
          powershell -NoProfile -Command "Expand-Archive -LiteralPath '${archive}' -DestinationPath '${install_dir}' -Force"
        else
          tar -xzf "${archive}" -C "${install_dir}"
        fi
        echo "${install_dir}/bin" >> "$GITHUB_PATH"
        if [ "${{ inputs.verify }}" = "true" ]; then
          "${install_dir}/bin/agentplane" --version | grep -Fx "${version}"
        fi
