name: setup-agentplane
description: Install the AgentPlane CLI in GitHub Actions.
inputs:
  version:
    description: AgentPlane version to install. Use a plain semver value such as 0.6.21.
    required: false
    default: "0.6.21"
  verify:
    description: Run an agentplane --version smoke check after installation.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install AgentPlane
      shell: bash
      run: |
        set -euo pipefail
        version="${inputs.version}"
        version="${version#v}"
        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$tmp_dir"' EXIT INT TERM
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          macOS-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.21/agentplane-bun-v0.6.21-darwin-arm64.tar.gz"
            asset_sha256="a3b5b2b61ba3ed8e6a5e9bedca63cfc1905d62be772e8258c58cb9ceedba2aed"
            ;;
          macOS-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.21/agentplane-bun-v0.6.21-darwin-x64.tar.gz"
            asset_sha256="a625c8dcd7c2f6416bc8327cd2d6d944be9abc3035182cec566de15e9d747aa7"
            ;;
          Linux-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.21/agentplane-bun-v0.6.21-linux-arm64.tar.gz"
            asset_sha256="dc300f896d24f3eb27cc58ea49237a59407f0cd1cc4b5147cda10b240b3e2410"
            ;;
          Linux-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.21/agentplane-bun-v0.6.21-linux-x64.tar.gz"
            asset_sha256="91f8fc8c0b40b729f3379b19846e2dcb60f67a38558d798878f4a192b899a3fe"
            ;;
          Windows-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.21/agentplane-bun-v0.6.21-win32-x64.zip"
            asset_sha256="4a5c8dc738ee599f983657db3272fcf7a1aeedad6538480d4293d0834089a8f1"
            ;;
          *)
            echo "Unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2
            exit 2
            ;;
        esac
        archive="${tmp_dir}/${asset_url##*/}"
        install_dir="${tmp_dir}/agentplane"
        mkdir -p "${install_dir}"
        curl -fsSL "${asset_url}" -o "${archive}"
        actual_sha256="$(shasum -a 256 "${archive}" | awk '{print $1}')"
        if [ "${actual_sha256}" != "${asset_sha256}" ]; then
          echo "agentplane archive checksum mismatch" >&2
          exit 2
        fi
        if [[ "${archive}" == *.zip ]]; then
          powershell -NoProfile -Command "Expand-Archive -LiteralPath '${archive}' -DestinationPath '${install_dir}' -Force"
        else
          tar -xzf "${archive}" -C "${install_dir}"
        fi
        echo "${install_dir}/bin" >> "$GITHUB_PATH"
        if [ "${{ inputs.verify }}" = "true" ]; then
          "${install_dir}/bin/agentplane" --version | grep -Fx "${version}"
        fi
