name: setup-agentplane
description: Install the AgentPlane CLI in GitHub Actions.
inputs:
  version:
    description: AgentPlane version to install. Use a plain semver value such as 0.7.10.
    required: false
    default: "0.7.10"
  verify:
    description: Run an agentplane --version smoke check after installation.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install AgentPlane
      shell: bash
      env:
        AGENTPLANE_VERSION: ${{ inputs.version }}
        AGENTPLANE_VERIFY: ${{ inputs.verify }}
      run: |
        set -euo pipefail
        version="${AGENTPLANE_VERSION#v}"
        if [ "${version}" != "0.7.10" ]; then
          echo "This action installs 0.7.10; use the matching action tag for another version." >&2
          exit 2
        fi
        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$tmp_dir"' EXIT INT TERM
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          macOS-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.10/agentplane-bun-v0.7.10-darwin-arm64.tar.gz"
            asset_sha256="180c7eb6034461bdaef1c69ffa3e08748bf20af688aac650fe6330523abe94e9"
            ;;
          macOS-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.10/agentplane-bun-v0.7.10-darwin-x64.tar.gz"
            asset_sha256="36aa36ac8be8c10cbafeaf047dbe31a7a4b329c35703d3b61853844bdb5a7753"
            ;;
          Linux-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.10/agentplane-bun-v0.7.10-linux-arm64.tar.gz"
            asset_sha256="83ee2dd1a64252c59e14046c7e006f499f0e93711a18f58d1ca0211f74a72ff2"
            ;;
          Linux-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.10/agentplane-bun-v0.7.10-linux-x64.tar.gz"
            asset_sha256="3ead102818c5f4d496719688162580c1633eb305ba231bf5612de3a99434b45d"
            ;;
          Windows-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.10/agentplane-bun-v0.7.10-win32-x64.zip"
            asset_sha256="ce7d648bf39150ac0818771728a2b0682eb620bfeefed5f63bce033b9c092658"
            ;;
          *)
            echo "Unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2
            exit 2
            ;;
        esac
        archive="${tmp_dir}/${asset_url##*/}"
        curl -fsSL "${asset_url}" -o "${archive}"
        actual_sha256="$(shasum -a 256 "${archive}" | awk '{print $1}')"
        if [ "${actual_sha256}" != "${asset_sha256}" ]; then
          echo "agentplane archive checksum mismatch" >&2
          exit 2
        fi
        install_dir="$(mktemp -d "${RUNNER_TEMP:?}/agentplane.XXXXXX")"
        if [[ "${archive}" == *.zip ]]; then
          powershell -NoProfile -Command "Expand-Archive -LiteralPath '${archive}' -DestinationPath '${install_dir}' -Force"
        else
          tar -xzf "${archive}" -C "${install_dir}"
        fi
        if [ "${AGENTPLANE_VERIFY}" = "true" ]; then
          "${install_dir}/bin/agentplane" --version | grep -Fx "${version}"
        fi
        echo "${install_dir}/bin" >> "$GITHUB_PATH"
