name: setup-agentplane
description: Install the AgentPlane CLI in GitHub Actions.
inputs:
  version:
    description: AgentPlane version to install. Use a plain semver value such as 0.7.7.
    required: false
    default: "0.7.7"
  verify:
    description: Run an agentplane --version smoke check after installation.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install AgentPlane
      shell: bash
      run: |
        set -euo pipefail
        version="${inputs.version}"
        version="${version#v}"
        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$tmp_dir"' EXIT INT TERM
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          macOS-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.7/agentplane-bun-v0.7.7-darwin-arm64.tar.gz"
            asset_sha256="94986b5457c6b736e17cf9f6f478e5c4a2c53c452f364acfbfb902fba3b4d8b9"
            ;;
          macOS-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.7/agentplane-bun-v0.7.7-darwin-x64.tar.gz"
            asset_sha256="fe544635cdb74fb6641cf3471734f3eee6eb0502bec466faf0cb8fd1d6458605"
            ;;
          Linux-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.7/agentplane-bun-v0.7.7-linux-arm64.tar.gz"
            asset_sha256="8fcb3a8487da61c72bb1213dcbc51601ba41b4da6ef0abca3a438d6556d9c3a5"
            ;;
          Linux-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.7/agentplane-bun-v0.7.7-linux-x64.tar.gz"
            asset_sha256="74c34fa5e5c546c0e743668769594d4abfc1711c1802b02c197ad7aad60343d2"
            ;;
          Windows-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.7/agentplane-bun-v0.7.7-win32-x64.zip"
            asset_sha256="2da0d467189ff845e89ffabddcac5ef105b5e1e0ab4ecd65b8f9f8fa1dd7c69d"
            ;;
          *)
            echo "Unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2
            exit 2
            ;;
        esac
        archive="${tmp_dir}/${asset_url##*/}"
        install_dir="${tmp_dir}/agentplane"
        mkdir -p "${install_dir}"
        curl -fsSL "${asset_url}" -o "${archive}"
        actual_sha256="$(shasum -a 256 "${archive}" | awk '{print $1}')"
        if [ "${actual_sha256}" != "${asset_sha256}" ]; then
          echo "agentplane archive checksum mismatch" >&2
          exit 2
        fi
        if [[ "${archive}" == *.zip ]]; then
          powershell -NoProfile -Command "Expand-Archive -LiteralPath '${archive}' -DestinationPath '${install_dir}' -Force"
        else
          tar -xzf "${archive}" -C "${install_dir}"
        fi
        echo "${install_dir}/bin" >> "$GITHUB_PATH"
        if [ "${{ inputs.verify }}" = "true" ]; then
          "${install_dir}/bin/agentplane" --version | grep -Fx "${version}"
        fi
