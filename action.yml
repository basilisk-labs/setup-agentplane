name: setup-agentplane
description: Install the AgentPlane CLI in GitHub Actions.
inputs:
  version:
    description: AgentPlane version to install. Use a plain semver value such as 0.6.4.
    required: false
    default: "0.6.4"
  verify:
    description: Run an agentplane --version smoke check after installation.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install AgentPlane
      shell: bash
      run: |
        set -euo pipefail
        version="${inputs.version}"
        version="${version#v}"
        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$tmp_dir"' EXIT INT TERM
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          macOS-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.4/agentplane-bun-v0.6.4-darwin-arm64.tar.gz"
            asset_sha256="fe3e2e4f0e897a62eddf552327c3104d0b8f78ea3050100521f28d02f61dff32"
            ;;
          macOS-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.4/agentplane-bun-v0.6.4-darwin-x64.tar.gz"
            asset_sha256="801cefb6896841c3e031a440db623769a5e74dd9636f84932c06f724a5692b2f"
            ;;
          Linux-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.4/agentplane-bun-v0.6.4-linux-arm64.tar.gz"
            asset_sha256="cfa5b8cb9dcd3f722f235e855b63775cd3637f596f4833078ea44616fdb7d486"
            ;;
          Linux-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.4/agentplane-bun-v0.6.4-linux-x64.tar.gz"
            asset_sha256="c51b5b5c7152f776382a4f3aaebb90d3bef4a4e0737a7fb05a2c7c1bdb4e4a81"
            ;;
          Windows-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.4/agentplane-bun-v0.6.4-win32-x64.zip"
            asset_sha256="682f56faa29e6644201abab317412abcbf8e2bb0ceb198e28946fb330a338c7b"
            ;;
          *)
            echo "Unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2
            exit 2
            ;;
        esac
        archive="${tmp_dir}/${asset_url##*/}"
        install_dir="${tmp_dir}/agentplane"
        mkdir -p "${install_dir}"
        curl -fsSL "${asset_url}" -o "${archive}"
        actual_sha256="$(shasum -a 256 "${archive}" | awk '{print $1}')"
        if [ "${actual_sha256}" != "${asset_sha256}" ]; then
          echo "agentplane archive checksum mismatch" >&2
          exit 2
        fi
        if [[ "${archive}" == *.zip ]]; then
          powershell -NoProfile -Command "Expand-Archive -LiteralPath '${archive}' -DestinationPath '${install_dir}' -Force"
        else
          tar -xzf "${archive}" -C "${install_dir}"
        fi
        echo "${install_dir}/bin" >> "$GITHUB_PATH"
        if [ "${{ inputs.verify }}" = "true" ]; then
          "${install_dir}/bin/agentplane" --version | grep -Fx "${version}"
        fi
