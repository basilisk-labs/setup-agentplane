name: setup-agentplane
description: Install the AgentPlane CLI in GitHub Actions.
inputs:
  version:
    description: AgentPlane version to install. Use a plain semver value such as 0.7.12.
    required: false
    default: "0.7.12"
  verify:
    description: Run an agentplane --version smoke check after installation.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install AgentPlane
      shell: bash
      env:
        AGENTPLANE_VERSION: ${{ inputs.version }}
        AGENTPLANE_VERIFY: ${{ inputs.verify }}
      run: |
        set -euo pipefail
        version="${AGENTPLANE_VERSION#v}"
        if [ "${version}" != "0.7.12" ]; then
          echo "This action installs 0.7.12; use the matching action tag for another version." >&2
          exit 2
        fi
        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$tmp_dir"' EXIT INT TERM
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          macOS-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.12/agentplane-bun-v0.7.12-darwin-arm64.tar.gz"
            asset_sha256="13f54a6292230c6fd8160ec887bb8d9ab616ef2ccff3df22e9086d2768763d00"
            ;;
          macOS-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.12/agentplane-bun-v0.7.12-darwin-x64.tar.gz"
            asset_sha256="e5e086d0768de5a8cb044b15484180f06fb091c250ccd61ecc79b1cd297a6ae7"
            ;;
          Linux-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.12/agentplane-bun-v0.7.12-linux-arm64.tar.gz"
            asset_sha256="445a3371d2d53332733dcfe6bdc516ff06678ac25dc9dfe96f7d0eca766edf8f"
            ;;
          Linux-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.12/agentplane-bun-v0.7.12-linux-x64.tar.gz"
            asset_sha256="611230499633d7528ca84aeccccc5a1540e1ff3d5ff904407cc61034aae9747c"
            ;;
          Windows-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.7.12/agentplane-bun-v0.7.12-win32-x64.zip"
            asset_sha256="2dd1a65e075bd2929027ce3ea4b5c11be572a6161cc8ccb5ad979f1c52ef1caa"
            ;;
          *)
            echo "Unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2
            exit 2
            ;;
        esac
        archive="${tmp_dir}/${asset_url##*/}"
        curl -fsSL "${asset_url}" -o "${archive}"
        actual_sha256="$(shasum -a 256 "${archive}" | awk '{print $1}')"
        if [ "${actual_sha256}" != "${asset_sha256}" ]; then
          echo "agentplane archive checksum mismatch" >&2
          exit 2
        fi
        install_dir="$(mktemp -d "${RUNNER_TEMP:?}/agentplane.XXXXXX")"
        if [[ "${archive}" == *.zip ]]; then
          powershell -NoProfile -Command "Expand-Archive -LiteralPath '${archive}' -DestinationPath '${install_dir}' -Force"
        else
          tar -xzf "${archive}" -C "${install_dir}"
        fi
        if [ "${AGENTPLANE_VERIFY}" = "true" ]; then
          "${install_dir}/bin/agentplane" --version | grep -Fx "${version}"
        fi
        echo "${install_dir}/bin" >> "$GITHUB_PATH"
