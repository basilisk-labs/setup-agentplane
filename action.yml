name: setup-agentplane
description: Install the AgentPlane CLI in GitHub Actions.
inputs:
  version:
    description: AgentPlane version to install. Use a plain semver value such as 0.6.14.
    required: false
    default: "0.6.14"
  verify:
    description: Run an agentplane --version smoke check after installation.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install AgentPlane
      shell: bash
      run: |
        set -euo pipefail
        version="${inputs.version}"
        version="${version#v}"
        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$tmp_dir"' EXIT INT TERM
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          macOS-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.14/agentplane-bun-v0.6.14-darwin-arm64.tar.gz"
            asset_sha256="59d34799a43626caf345727b8a5f2bfd5b14b7db6e20f6fafcf34519d0f1582b"
            ;;
          macOS-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.14/agentplane-bun-v0.6.14-darwin-x64.tar.gz"
            asset_sha256="6ac0bca8f0d08f19e9f193cb14560dc26e326df3abd01b014928e1cd0d8a461d"
            ;;
          Linux-ARM64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.14/agentplane-bun-v0.6.14-linux-arm64.tar.gz"
            asset_sha256="e4bdfe6a5660b7ac186e778760ae2d5064cad93ae2b1c8bf769e44b44286c31c"
            ;;
          Linux-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.14/agentplane-bun-v0.6.14-linux-x64.tar.gz"
            asset_sha256="634a994627a48e528747b656fb3983a056fbe89865009818a8e9930394391fa8"
            ;;
          Windows-X64)
            asset_url="https://github.com/basilisk-labs/agentplane/releases/download/v0.6.14/agentplane-bun-v0.6.14-win32-x64.zip"
            asset_sha256="08837e37bd0ef3b38dde12a7c8d1903cd63afa82951e062ed13cfc786c13a06b"
            ;;
          *)
            echo "Unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2
            exit 2
            ;;
        esac
        archive="${tmp_dir}/${asset_url##*/}"
        install_dir="${tmp_dir}/agentplane"
        mkdir -p "${install_dir}"
        curl -fsSL "${asset_url}" -o "${archive}"
        actual_sha256="$(shasum -a 256 "${archive}" | awk '{print $1}')"
        if [ "${actual_sha256}" != "${asset_sha256}" ]; then
          echo "agentplane archive checksum mismatch" >&2
          exit 2
        fi
        if [[ "${archive}" == *.zip ]]; then
          powershell -NoProfile -Command "Expand-Archive -LiteralPath '${archive}' -DestinationPath '${install_dir}' -Force"
        else
          tar -xzf "${archive}" -C "${install_dir}"
        fi
        echo "${install_dir}/bin" >> "$GITHUB_PATH"
        if [ "${{ inputs.verify }}" = "true" ]; then
          "${install_dir}/bin/agentplane" --version | grep -Fx "${version}"
        fi
